name: Update profile README

# Regenerates everything on the profile that comes from the repositories:
# the three most recently worked-on public projects, the stack detected from
# them, the two language donuts and one language bar per public repository.
#
# It opens a pull request only when something actually changed, and keeps a
# single one open: a later run updates it instead of stacking another beside
# it. Dates on the page do not need a run at all -- they come from live
# badges.

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - ".github/workflows/update-profile.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        # A broken renderer must not reach the README.
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Regenerate
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update-profile.py --write --report "${{ runner.temp }}/report.md"

      - name: Open a pull request
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=chore/profile-refresh

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add README.md assets/generated
          git commit -m "chore: atualiza o perfil a partir dos repositorios"

          # One long-lived branch, one open pull request. A second run before
          # the first is merged updates that pull request instead of stacking
          # another one beside it.
          open=$(gh pr list --head "$branch" --state open --json number --jq '.[].number')

          # Until that pull request is merged, main stays behind it and every
          # run finds the same change again. Push only when it is new.
          if [ -n "$open" ] && git fetch --quiet origin "$branch" && git diff --quiet FETCH_HEAD HEAD; then
            echo "pull request #$open already holds this change"
            exit 0
          fi
          git push --force -u origin "$branch"

          if [ -z "$open" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: atualiza o perfil a partir dos repositorios" \
              --body-file "${{ runner.temp }}/report.md"
          else
            gh pr edit "$open" --body-file "${{ runner.temp }}/report.md"
          fi
