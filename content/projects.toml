# The writing behind each project card in the generated
# <!-- projects:start --> block.
#
# The three newestly worked-on public repositories are chosen by the
# workflow, not here. This file only supplies what no API can produce: the
# title, the headline after the colon, the narrative, the decisions behind
# the fold, and the curated chips.
#
# Every field is optional, and a repository with no table at all still
# renders. It falls back to the repository name, the GitHub description and
# the topics that resolve to a known technology. A project is never missing
# and never broken -- it is either rich or plain.

[halcyon-goods-product-control]
title = "Halcyon Goods"
headline = "inventory control, three ways in"
body = """
A back-office inventory system in a monorepo: a FastAPI records API, a Next.js dashboard and a terminal client, all speaking one HTTP contract. No business rule lives in two places.

I split it into three applications on purpose, and not because of scale. There is no scale here. I wanted the boundary between browser and API enforced by the build.
"""
decisions = [
    "**One HTTP contract, two clients.** The terminal gets the same truth as the browser, because neither one owns a rule.",
    "**The browser never talks to the API directly.** Requests go browser → Next.js server → FastAPI → Postgres, in that order, so the dashboard needs no CORS and the API key never reaches the browser.",
    "**Alembic migrations applied and rolled back in CI**, against a real PostgreSQL, not a mock.",
    "**108 automated tests**, with the API suite running on Python 3.11, 3.12 and 3.13.",
    "**`docker compose up` brings the whole stack online** with one command.",
]
chips = ["Python", "FastAPI", "SQLModel", "PostgreSQL", "Alembic", "Next.js", "TypeScript", "Docker"]


[linkedin-growth-agents]
title = "LinkedIn Growth"
headline = "a multi-agent system that writes, reviews and refuses"
body = """
Ten [Agno](https://github.com/agno-agi/agno) agents that audit a LinkedIn profile, plan content, draft posts in Portuguese and English and render them as carousels, images or videos, coordinated by a team leader that delegates and synthesizes. Text goes out through LinkedIn's official API, and only after I approve it. Once a post has numbers, an analyst reads them and proposes what to change.

It scores every draft against a seven-criteria rubric, and one of them is disqualifying: if the post claims experience the person doesn't have, the whole thing fails. It ran against my own data and rejected a draft I'd have been happy to publish, because I hadn't actually measured what the post said I'd measured. The system was right and I wasn't.
"""
decisions = [
    "**The strategy lives in one file.** Changing how ten agents behave means editing `principles.py`, not ten agent files.",
    "**Long-term memory across conversations.** The team writes what it learns; the agents read it. Something you mention on a Tuesday reaches a different agent, in a different session, on Friday.",
    "**389 tests, none of which call a paid API.** A spy model stands in for Claude, so the tests can assert what actually reached the prompt.",
    "**Honesty is a hard gate, not a guideline.** No invented experience, no numbers that aren't in the source data.",
]
chips = ["Python", "Agno", "Anthropic API", "SQLite", "Typer", "Playwright", "pytest"]


[students-categorization]
title = "Students Categorization"
headline = "from a dirty CSV to a neural network"
body = """
A study project that walks the whole path of a classification problem. A Python medallion pipeline takes 10,000 rows of messy, fictional student data, validates them against a JSON data contract and encodes the 6,574 valid students as vectors for a TensorFlow.js network running in Node.

The whole path is done: bronze keeps the CSV as it arrived, silver applies the contract and records why each of the 3,248 rejected rows failed, gold writes the input and output vectors, and a TensorFlow.js network trains on them. Students who sign up later take the same path in files of their own, and the network suggests a category for each of them. What it still doesn't do is test the model on students it has never seen, and the README says so.
"""
decisions = [
    "**A contract decides what valid means.** Types, ranges, allowed values and synonyms live in one JSON file, so `sp`, `São Paulo, SP` and `sao paulo - sp` all land on `São Paulo` without an `if` in the cleaning code.",
    "**Rejected rows keep their reason.** Silver never drops a bad row silently: it keeps the raw values, the source line and one error column per field, so every rejection traces back to a line of the CSV.",
    "**Age is scaled by the contract, not by the data.** Min-max uses the contract's 18 to 65 bounds instead of the dataset's own minimum and maximum, so a new student at prediction time lands on the same scale as the training set.",
    "**The sign-up time is the watermark.** A run reads the whole file of new students but adds only the ones who signed up after the last student already in, so running it twice adds nothing. Every line that stays out goes to a quarantine file once, with its reason: invalid, empty, duplicate or late.",
    "**The roadmap is public and honest.** Contract, the three layers, training, new students and their categories are checked off; evaluating the model on unseen students is not, and the README lists it as a known issue. A study project that claims to be finished teaches nobody anything.",
]
chips = ["Python", "pandas", "TensorFlow.js", "Node.js", "JavaScript"]


[products-recommendations]
title = "Products Recommendations"
headline = "a recommender that will train in the browser"
body = """
An e-commerce page that runs entirely in the browser: pick a customer, see what they bought, buy something else. Those purchases are the data a TensorFlow.js network will learn to recommend products from, in a Web Worker so the page never freezes, with tfjs-vis wired up to chart the training.

It's early. The page, the purchase tracking and the worker plumbing run; the network doesn't exist yet, and the training step is a placeholder that reports progress without learning anything. The README says so in its opening lines.
"""
chips = ["JavaScript", "TensorFlow.js", "tfjs-vis", "Web Workers", "Bootstrap"]


[lang-chain-implementation]
title = "LangChain Implementation"
headline = "a chat endpoint that routes by intent"
body = """
A Fastify endpoint backed by a LangGraph.js state graph. A question comes in at `POST /chat`, a first node works out what the message is asking for, and a conditional edge sends it to the node that handles it: make it uppercase, make it lowercase, or answer that the command is unknown. Every branch ends in the same node, which turns the result into the reply.

The commands are deliberately trivial, because the point is the graph itself: typed state, conditional routing and one node per responsibility. The intent step is keyword matching today, not a model, and the README says so. The graph also opens in LangSmith Studio with Chat mode available, which is what pushed me to build the state on `MessagesZodState`.
"""
decisions = [
    "**State built on `MessagesZodState`.** It exposes `langgraph_type: \"messages\"` in the schema, which is what makes LangSmith Studio offer Chat mode; `output` and `command` have defaults so a client only has to send messages.",
    "**Routing is a conditional edge, not an `if` inside a node.** The intent node only labels the message; the graph decides where it goes, so adding a command means adding a node and a branch.",
    "**Three end-to-end tests through Fastify's `inject()`.** Upper case, lower case and unknown command run in-process, with no open port and no network.",
]
chips = ["TypeScript", "Node.js", "Fastify", "LangGraph", "LangChain"]


[LLMs-APIs-integrations]
title = "LLMs APIs Integrations"
headline = "a gateway that picks the model so the client doesn't"
body = """
A collection of reference implementations for putting an LLM behind an HTTP API. The first one is a small Fastify gateway: the client posts a question, and the gateway sends it to OpenRouter with an ordered list of candidate models. OpenRouter falls back through the list and picks the provider by price, latency or throughput, and the response says which model actually answered.

The routing policy lives in one config file, so changing the fallback order or the sort strategy never touches the service code. The gateway refuses to start without an API key, and the repository's `main` is protected behind a CI check.
"""
decisions = [
    "**Model fallback and provider sorting are delegated to OpenRouter.** The gateway sends `models[]` plus `provider.sort`; it doesn't reimplement retries.",
    "**The response names the model that answered.** A client can always tell which fallback it got.",
    "**The tests hit the real OpenRouter API, so they are not run in CI.** They need a key and depend on live provider rankings; CI runs the type check, and the README says exactly that.",
]
chips = ["TypeScript", "Node.js", "Fastify", "OpenRouter"]


[rag-implementation]
title = "RAG Implementation"
headline = "a GraphRAG that checks its own answers"
body = """
A reusable GraphRAG in TypeScript. It loads documents into Neo4j (a vector index, a fulltext index and an entity graph), retrieves with vector and fulltext search fused together and expanded through the graph, and makes a single call to a free OpenRouter model. Then the answer is checked locally: every citation has to exist in the retrieved context, and every sentence is compared by embedding similarity with the passages it cites.

I built it around one question, can I trust this answer? A question the corpus can't answer is refused before the model is even called, and the Sources section is built by code from validated citations, never written by the model. The README reports numbers from commands in the repository, including the ones that went badly.
"""
decisions = [
    "**A refusal is a correct answer.** An evidence gate refuses when the best passage scores below a threshold, which saves quota and avoids invention.",
    "**Zero cost, enforced.** Only free OpenRouter models are allowed, and a non-free one is refused before any request is made.",
    "**The reranker was not promoted.** Its nDCG@6 was 0.483 against 0.574 for the pass-through baseline, so the repository ships the baseline and says so. Adding the graph raised recall@6 from 0.813 to 0.875.",
    "**The domain is data, not code.** Prompts, corpus and evaluation sets live in a domain folder, and a test fails if domain vocabulary leaks into `src/core`.",
]
chips = ["TypeScript", "Neo4j", "OpenRouter", "TensorFlow.js", "Grafana"]
