# Badge catalog for the generated <!-- stack:start --> block in the README.
#
# Detection reads languages and topics from the eligible public repositories
# and may ADD technologies it finds. It never removes an entry listed here,
# and it never touches a group named in `frozen`.
#
# Anything detected that is not already an entry below goes to the group
# `[placement]` names for it, with its colour and logo resolved from
# simple-icons. Only a technology [placement] does not mention falls through
# to `new_group`, and the run's report says so.

[settings]
# A language must hold at least this share of a repository's bytes to count.
# Below it sit Alembic's Mako templates, Next.js CSS and stray config files.
language_threshold = 0.05

# Tried, in order, when a term does not match simple-icons directly.
suffixes = ["js", "node", "py", "cli", "api", "sdk"]

# The last resort for a technology that [placement] does not know. It stays
# empty, and so unrendered, as long as [placement] covers what you use.
new_group = "Recently picked up"

# Group render order. A group with no technologies is not rendered at all.
order = [
    "AI and Python",
    "Backend and data",
    "Infrastructure",
    "Frontend, when the project needs one",
    "From the data years",
    "Recently picked up",
]

# Detection may neither add to nor remove from these groups. "From the data
# years" describes professional experience that leaves no trace in any
# public repository, so no scan could ever confirm it.
frozen = ["From the data years"]

# Raw term -> catalog entry name. Checked before simple-icons, so a topic
# that would otherwise resolve to its own badge folds into one you already
# have. Without these, `anthropic` and `claude` would each render a second
# badge beside "Anthropic API".
#
# The second half maps GitHub's language names onto simple-icons titles that
# spell them differently: GitHub says HTML and Shell, simple-icons says HTML5
# and GNU Bash.
[aliases]
anthropic = "Anthropic API"
claude = "Anthropic API"
dockerfile = "Docker"
"github-actions" = "GitHub Actions"
html = "HTML5"
shell = "GNU Bash"
"jupyter-notebook" = "Jupyter"

# Group -> the technologies that belong in it when detection first finds
# them. Names are simple-icons titles, matched loosely, so "Node.js" also
# catches `nodejs`. A name here that is also a [[tech]] entry below is
# harmless: the entry wins.
#
# Frozen groups cannot appear here.
[placement]
"AI and Python" = [
    "TensorFlow", "PyTorch", "Keras", "scikit-learn", "Hugging Face", "LangChain",
    "LangGraph", "OpenAI", "Ollama", "Google Gemini", "Mistral AI", "Jupyter",
    "Streamlit", "Gradio", "MLflow", "spaCy", "OpenCV", "Typer", "Poetry", "uv",
    "Ruff",
]
"Backend and data" = [
    "Flask", "Django", "Celery", "SQLAlchemy", "pandas", "NumPy", "Polars", "SciPy", "Apache Parquet", "DuckDB", "Apache Airflow",
    "dbt", "Apache Kafka", "RabbitMQ", "Redis", "MongoDB", "MySQL", "SQLite", "MariaDB",
    "Supabase", "Firebase", "Neo4j", "Elasticsearch", "Snowflake", "Prisma", "GraphQL",
    "Node.js", "Express", "NestJS", "Fastify", "Deno", "Bun", "Go", "Rust", "Java",
    "Spring", "Kotlin", "Ruby", "Ruby on Rails", "PHP", "Laravel", ".NET", "Elixir",
    "Plotly", "Swagger", "Postman",
]
"Infrastructure" = [
    "Kubernetes", "Helm", "Terraform", "Ansible", "Amazon Web Services", "Google Cloud",
    "Vercel", "Netlify", "Render", "Fly.io", "Cloudflare", "Nginx", "Linux", "Ubuntu",
    "GNU Bash", "PowerShell", "GitLab", "Prometheus", "Grafana", "Podman", "pre-commit",
]
"Frontend, when the project needs one" = [
    "JavaScript", "HTML5", "CSS", "Sass", "Tailwind CSS", "Bootstrap", "Vue.js", "Nuxt",
    "Svelte", "Angular", "Astro", "Remix", "Vite", "Webpack", "Redux", "Chart.js",
    "D3.js", "Three.js", "Storybook", "Jest", "Vitest", "Playwright", "Cypress", "npm",
    "pnpm", "Yarn",
]


